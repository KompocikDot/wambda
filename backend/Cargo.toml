[package]
name = "wambda"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = { version = "1.0.103", features = ["backtrace"] }
argon2 = { version = "0.5.3", features = ["std"] }
axum = { version = "0.8.9", features = ["macros", "multipart", "tracing"] }
axum_typed_multipart = "0.16.6"
base64 = "0.22.1"
chrono = "0.4.45"
dotenv = "0.15.0"
http = "1.4.2"
http-body-util = "0.1.4"
log = "0.4.33"
moka = { version = "0.12.16", features = ["future"] }
rust-s3 = "0.37.2"
sea-orm = { version = "2.0.0-rc.34", features = ["sqlx-postgres", "macros", "with-time", "with-json", "runtime-tokio-native-tls", "schema-sync", "entity-registry"] }
serde = { version = "1.0.228", features = ["derive", "std"] }
serde_json = "1.0.150"
sha256 = "1.6.0"
tokio = { version = "1.52.3", features = ["full"] }
tower-http = { version = "0.7.0", features = ["cors", "trace"] }
tower-sessions = { version = "0.14", features = ["private", "signed"] }
tower-sessions-cookie-store = { version = "0.5.2", features = ["private", "signed"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1.23.4", features = ["v7"] }
validator = { version = "0.20.0", features = ["derive"] }
wasmtime = { version = "47.0.3", features = ["anyhow"] }
wasmtime-wasi = { version = "47.0.3", features = ["p3"] }
wasmtime-wasi-http = { version = "47.0.3", features = ["component-model-async", "p3"] }
wasmtime-wasi-io = "47.0.3"
